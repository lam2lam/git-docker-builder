name: Build and Package XLS Docker Image

on:
  workflow_dispatch: # Trigger manually from your repository Actions tab

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4

      - name: Pull Google XLS Codebase
        run: git clone https://github.com/google/xls.git

      - name: Build XLS Container Image
        run: |
          docker build \
            ./xls \
            -f ./xls/Dockerfile-ubuntu-22.04 \
            -t company-xls-dev:latest 

      - name: Export Container to Archive File
        run: docker save company-xls-dev:latest -o xls-dev-image.tar

      - name: Upload Workspace Archive
        uses: actions/upload-artifact@v4
        with:
          name: xls-docker-image
          path: xls-dev-image.tar
          retention-days: 3
